name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conventions:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check branch name and PR title
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          sh scripts/check-conventions.sh --branch "$HEAD_REF"
          sh scripts/check-conventions.sh --title "$PR_TITLE"

  lint:
    name: PHPCS + PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v3

      - name: PHPCS (WordPress Coding Standards)
        run: vendor/bin/phpcs -p

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  unit:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v3

      - name: PHPUnit (unit)
        run: vendor/bin/phpunit -c phpunit-unit.xml.dist

  conformance:
    name: Conformance harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The harness brings its own pinned WordPress, WooCommerce and MariaDB,
      # so nothing here needs PHP or composer. It runs the scripted checkout;
      # the official UCP suite lives in another repository and is a release
      # gate rather than a per-push one (docs/conformance.md).
      - name: Throwaway shop + scripted UCP checkout
        run: make conformance
